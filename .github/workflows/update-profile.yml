name: Update profile art

# Refreshes data/*.json from GitHub, regenerates every SVG in assets/, and
# commits the result — all in one job, so the "assets changed" commit can
# never race with itself. push is scoped to the paths that affect the
# generators, so editing this workflow or the README doesn't retrigger it.
on:
  schedule:
    - cron: "17 6 * * *" # daily, ~06:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "source-prepped.png"

# Only one run at a time, and a superseded run for the same branch is
# cancelled rather than left to fight over the same commit.
concurrency:
  group: profile-art-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  profile-art:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Regenerate data and assets
        run: python scripts/build_all.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile data and assets [skip ci]"
          file_pattern: |
            data/*.json
            assets/*.svg
