name: Update Profile Art

on:
  schedule:
    # Runs every day at approximately 06:17 UTC
    - cron: "17 6 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  profile-art:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Fetch GitHub contributions
        run: |
          python scripts/fetch_contributions.py

      - name: Generate profile SVG assets
        run: |
          python scripts/render_heatmap_svg.py
          python scripts/make_info_card.py
          python scripts/make_hero.py
          python scripts/make_projects.py
          python scripts/make_architecture.py

      - name: Commit generated files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile SVG assets [skip ci]"
          file_pattern: |
            data/contributions.json
            assets/*.svg