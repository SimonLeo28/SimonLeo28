<svg xmlns="http://www.w3.org/2000/svg"
        width="620"
        height="450"
        viewBox="0 0 620 450">

<style>
.ascii {
    font-family: "Courier New", monospace;
    font-size: 8px;
    font-weight: 600;
    fill: #8b949e;
}

@keyframes reveal {
    from {
        opacity: 0;
        transform: translateX(-10px);
    }

    to {
        opacity: 1;
        transform: translateX(0);
    }
}

.row {
    opacity: 0;
    animation: reveal 0.45s ease-out forwards;
}
</style>

