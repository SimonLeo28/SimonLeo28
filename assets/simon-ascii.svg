<svg xmlns="http://www.w3.org/2000/svg" width="676" height="552" viewBox="0 0 676 552" role="img" aria-labelledby="t d">
<title id="t">Simon Leo Alexander — ASCII portrait</title>
<desc id="d">A photo of Simon rendered as ASCII art that fades in row by row, with a soft scanline sweeping over it.</desc>
<style>
svg{font-family:'JetBrains Mono','Fira Code','SF Mono',SFMono-Regular,ui-monospace,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace}
text{font-family:'JetBrains Mono','Fira Code','SF Mono',SFMono-Regular,ui-monospace,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace}
.blink{animation:blink 1.06s steps(1,end) infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.28}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.row{opacity:0;animation:rowin .5s ease-out forwards}
@keyframes rowin{to{opacity:1}}
.sweep{animation:sweep 6s ease-in-out infinite}
@keyframes sweep{0%,100%{transform:translateY(-10px)}50%{transform:translateY(450.5px)}}
</style>

