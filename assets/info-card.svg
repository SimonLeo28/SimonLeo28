<svg xmlns="http://www.w3.org/2000/svg"
        width="490"
        height="430"
        viewBox="0 0 490 430">

<style>

.background {
    fill: #0d1117;
    stroke: #30363d;
    stroke-width: 1;
}

.header {
    fill: #161b22;
}

.title {
    font-family: monospace;
    font-size: 16px;
    font-weight: bold;
    fill: #58a6ff;
}

.prompt {
    font-family: monospace;
    font-size: 13px;
    fill: #8b949e;
}

.key {
    font-family: monospace;
    font-size: 13px;
    font-weight: bold;
    fill: #79c0ff;
}

.value {
    font-family: monospace;
    font-size: 13px;
    fill: #c9d1d9;
}

.dot {
    fill: #f85149;
}

.dot2 {
    fill: #d29922;
}

.dot3 {
    fill: #3fb950;
}

.row {
    opacity: 0;
    animation: appear 0.45s ease-out forwards;
}

@keyframes appear {

    from {
        opacity: 0;
        transform: translateY(7px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}

</style>


<rect
    class="background"
    x="0"
    y="0"
    width="490"
    height="430"
    rx="12"
/>


