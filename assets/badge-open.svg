<svg xmlns="http://www.w3.org/2000/svg" width="300" height="46" viewBox="0 0 300 46" role="img" aria-labelledby="t d">
<title id="t">Status: open to opportunities</title>
<desc id="d">OPEN TO OPPORTUNITIES button</desc>
<style>
svg{font-family:'JetBrains Mono','Fira Code','SF Mono',SFMono-Regular,ui-monospace,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace}
text{font-family:'JetBrains Mono','Fira Code','SF Mono',SFMono-Regular,ui-monospace,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace}
.blink{animation:blink 1.06s steps(1,end) infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.28}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.sh{animation:sh 3.6s ease-in-out infinite}
@keyframes sh{0%,55%{transform:translateX(-80px)}100%{transform:translateX(380px)}}
</style>

<defs><clipPath id="b"><rect width="300" height="46" rx="9"/></clipPath>
<linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#f0b429" stop-opacity="0"/><stop offset=".5" stop-color="#f0b429" stop-opacity=".28"/><stop offset="1" stop-color="#f0b429" stop-opacity="0"/></linearGradient></defs>
<rect x=".5" y=".5" width="299" height="45" rx="9" fill="#0a0f14" stroke="#f0b429" stroke-opacity=".55"/>
<g clip-path="url(#b)"><rect class="sh" width="60" height="46" fill="url(#shine)" x="0"/></g>
<rect x="1" y="1" width="298" height="44" rx="8" fill="none" stroke="#f0b429" stroke-width="2" stroke-linecap="round" stroke-dasharray="90 580.27" opacity="1.0"><animate attributeName="stroke-dashoffset" from="0" to="-670.27" dur="4.5s" begin="0s" repeatCount="indefinite"/></rect>
<circle class="pulse" cx="26" cy="23" r="5" fill="#f0b429"/>
<text x="44" y="28.5" font-size="13" font-weight="700" letter-spacing="1" fill="#e6edf3" textLength="163.8" lengthAdjust="spacing">OPEN TO OPPORTUNITIES</text>
</svg>
